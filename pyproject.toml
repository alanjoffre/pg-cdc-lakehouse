[project]
name = "pg-cdc-lakehouse"
version = "0.1.0"
description = "Replicação de PostgreSQL para Parquet com CDC (Debezium + Apache Kafka), sem perder nem duplicar linha"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["duckdb>=1.4", "confluent-kafka>=2.6", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
