# CI do pg-cdc-lakehouse.
#   ci        → a cada push e PR: lint (ruff), tipos (mypy) e testes de unidade (pytest), sem Docker.
#   cenarios  → sob demanda (Actions → ci → Run workflow): sobe PostgreSQL, Kafka e Debezium no
#               Docker do runner, roda os 4 cenários (3 falhas e a operação normal) e reconcilia origem × destino (~10 min).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cenarios:
        description: "Rodar também os 4 cenários de ponta a ponta (Docker)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_LOCKED: "1" # falha se o uv.lock não bater com o pyproject (em vez de instalar um lock velho)

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest -q

  cenarios:
    if: github.event_name == 'workflow_dispatch' && inputs.cenarios
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync
      - run: docker compose pull -q
      # Apaga o relatório versionado: o resumo mostra só o que ESTA execução gerou.
      - run: rm -f reports/cenarios.json reports/cenarios.md
      - run: uv run python -m cdc.cenarios
      - name: Relatório no resumo da execução
        if: always()
        run: test -f reports/cenarios.md && cat reports/cenarios.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: docker compose down -v
